<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SightWordsRed - iOS Developer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Welcome to SightWordsRed</h1>
    <p>iOS Apps for Learning & Fun</p>
  </header>

  <section class="apps">
    <h2>My Apps</h2>
    <div class="app-card">
      <h3>Sight Words by Color</h3>
      <p>Learn sight words with colorful cards and proper pronunciation.</p>
    </div>
    <div class="app-card">
      <h3>Multiply by Voice</h3>
      <p>Master multiplication with voice answers and audio feedback.</p>
    </div>
  </section>

  <section class="contact">
    <h2>Contact Me</h2>
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="email" name="email" placeholder="Your email" required>
      <textarea name="message" placeholder="Your message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>© 2025 SightWordsRed. All rights reserved.</p>
  </footer>
</body>
</html>
